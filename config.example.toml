# SaussuNet configuration (template written by `saussunet init`).

[server]
# Phase 1 opens no listener; the default is pinned to localhost (INFR-02, T-01-02).
bind = "127.0.0.1:8080"
# All HTTP routes are nested under this base path (D-13). Normalized at
# resolve time: leading slash, no trailing slash.
base_path = "/saussunet"

[storage]
# Data root: holds saussunet.db and vaults/<id>/. Must never live inside a
# vault directory (threat T-01-01 — a vault is served/previewed later).
data_dir = "./data"

[vault]
# The single v1 vault (D-04): filesystem path is <data_dir>/vaults/<id>/.
id = 1
name = "main"

[llm]
# Single active provider (D-02): "mock" (default — deterministic, zero secrets)
# or "openai-compatible". NOTE: a "mock" daemon does NOT drain the job queue
# (WR-03) — an empty-script mock would dead-letter every job — so jobs stay
# pending until a real provider is configured here.
provider = "mock"
# base_url = "https://api.openai.com/v1"
# model = "gpt-4o-mini"
# api_key lives here (this file is gitignored) or in the SAUSSUNET_LLM__API_KEY
# env var, which wins over this file (D-03). Never commit a real key.
# api_key = "replace-me"
# Worker-pool bound; 1 is safe for a local iGPU LLM (D-04).
# max_concurrency = 1
# timeout_secs = 300

[pipeline]
# Extraction-pipeline thresholds (D-14). Sane defaults apply when this
# section is absent entirely.
min_sources = 2
# Upload cap for the PDF ingest route (25 MiB).
max_upload_bytes = 26214400
# Fetch cap for URL ingestion (5 MiB).
max_fetch_bytes = 5242880
